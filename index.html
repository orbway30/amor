<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Você ❤️</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#ff4d6d,#ff8fab);
    color:white;
    text-align:center;
    overflow-x:hidden;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.20),transparent 30%),
    radial-gradient(circle at 80% 50%,rgba(255,255,255,.15),transparent 30%),
    radial-gradient(circle at 50% 90%,rgba(255,255,255,.20),transparent 30%);

    pointer-events:none;
}

.container{
    padding:50px 20px;
    position:relative;
    z-index:2;
}

h1{
    font-size:3em;
    text-shadow:0 0 20px rgba(255,255,255,.5);
}

.card{
    max-width:700px;
    margin:20px auto;
    background:rgba(255,255,255,0.15);
    padding:25px;
    border-radius:20px;
    backdrop-filter:blur(8px);
}

button{
    background:white;
    color:#ff4d6d;
    border:none;
    padding:15px 25px;
    margin:10px;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 0 20px rgba(255,255,255,.4);

    animation:pulsar 2s infinite;
}

button:hover{
    transform:scale(1.08);
}

@keyframes pulsar{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
        box-shadow:0 0 30px rgba(255,255,255,.9);
    }

    100%{
        transform:scale(1);
    }

}

#contador{
    font-size:22px;
    margin:20px 0;
    font-weight:bold;
}

#motivo{
    font-size:24px;
    margin-top:20px;
    min-height:40px;
}

.heart{
    position:fixed;
    pointer-events:none;
    z-index:1;

    animation:fall linear forwards;
}

@keyframes fall{

    from{
        transform:translateY(-100px);
    }

    to{
        transform:translateY(110vh);
    }

}

.foto-bg{
    position:fixed;
    opacity:0.08;
    pointer-events:none;
    z-index:0;

    animation:flutuar 8s ease-in-out infinite;
}

@keyframes flutuar{

    0%{
        transform:translateY(0px) rotate(-3deg);
    }

    50%{
        transform:translateY(-15px) rotate(3deg);
    }

    100%{
        transform:translateY(0px) rotate(-3deg);
    }

}

#carta{
    animation:aparecer .8s ease;
}

@keyframes aparecer{

    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

</style>
</head>

<body>

<div class="container">

<h1>❤️ Você é meu Momo ❤️</h1>

<div class="card">

<h2>Feliz Dia dos Namorados ❤️</h2>

<p>
Você é uma das melhores coisas que aconteceram na minha vida.
Obrigado por cada sorriso, cada abraço e cada momento ao seu lado.
</p>

<div id="contador"></div>

<button onclick="abrirMusica()">
🎵 Uma música que me representa ❤️
</button>

<br>

<button onclick="mostrarMotivo()">
❤️ Por que eu te amo?
</button>

<div id="motivo"></div>

<button onclick="mostrarCarta()">
💌 Ler Minha Carta
</button>

<div id="carta"></div>

</div>

</div>

<script>

for(let i=0;i<20;i++){

    const img = document.createElement("img");

    img.src="foto.png";

    img.className="foto-bg";

    img.style.left=Math.random()*100+"vw";
    img.style.top=Math.random()*100+"vh";

    img.style.width=(60+Math.random()*60)+"px";

    document.body.appendChild(img);
}

function abrirMusica(){

    window.open(
        "https://www.youtube.com/watch?v=YuByvjwo-HQ",
        "_blank"
    );

}

const motivos = [

"Porque eu esqueço do mundo quando estou com você.",
"Porque eu amo cada detalhe seu.",
"Porque você transforma momentos simples em lembranças incríveis.",
"Porque aguenta minhas piadas ruins.",
"Porque você me faz querer ser uma pessoa melhor.",
"Porque eu consigo ser eu mesmo quando estou com você.",
"Porque você deixa meus dias mais felizes.",
"Porque você faz qualquer lugar parecer especial.",
"Porque até o silêncio ao seu lado é confortável.",
"Porque você é minha pessoa favorita."

];

function mostrarMotivo(){

    const aleatorio =
    motivos[Math.floor(Math.random()*motivos.length)];

    document.getElementById("motivo").innerHTML =
    aleatorio;

}

function mostrarCarta(){

document.getElementById("carta").innerHTML=`

<div class="card">

<h2>💌 Uma Carta Para o Amor da Minha Vida</h2>

<p>

Meu amor,

<br><br>

Obrigado por existir.

<br><br>

Você transformou meus dias em algo muito mais especial.

<br><br>

Cada conversa, cada risada e cada momento ao seu lado
ficam guardados no meu coração.

<br><br>

Você é a pessoa que eu escolho todos os dias.

<br><br>

E se eu pudesse escolher novamente,
continuaria escolhendo você.

<br><br>

❤️ Te amo infinitamente ❤️

</p>

</div>

`;

}

const inicio = new Date("2026-02-14T22:47:00");

function atualizarContador(){

    const hoje = new Date();

    const diff = hoje - inicio;

    const dias =
    Math.floor(diff/(1000*60*60*24));

    const horas =
    Math.floor((diff/(1000*60*60))%24);

    const minutos =
    Math.floor((diff/(1000*60))%60);

    const segundos =
    Math.floor((diff/1000)%60);

    document.getElementById("contador").innerHTML=
    `❤️ Estamos criando memórias há ${dias} dias, ${horas}h ${minutos}m ${segundos}s ❤️`;

}

atualizarContador();

setInterval(atualizarContador,1000);

function criarCoracao(){

    const heart=document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=
    (15+Math.random()*35)+"px";

    heart.style.animationDuration=
    (3+Math.random()*5)+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },8000);

}

setInterval(criarCoracao,250);

</script>

</body>
</html>
